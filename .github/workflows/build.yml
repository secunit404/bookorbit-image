name: Build patched release

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the image for this release already exists
        type: boolean
        default: false
      release_tag:
        description: Build this upstream tag instead of the latest release
        type: string
        default: ''

permissions:
  contents: write
  packages: write

concurrency:
  group: build-patched-release
  cancel-in-progress: false

env:
  UPSTREAM: bookorbit/bookorbit
  IMAGE: ghcr.io/${{ github.repository_owner }}/bookorbit-patched
  ADAPTER: server/src/modules/book-request/download-clients/adapters/qbittorrent.adapter.ts

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v5

      - name: Resolve the upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_TAG}" ]; then
            TAG="${REQUESTED_TAG}"
          else
            TAG=$(gh api "repos/${UPSTREAM}/releases/latest" --jq .tag_name)
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Upstream release: ${TAG}" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Skip releases that are already built
        id: existing
        env:
          TAG: ${{ steps.release.outputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ "${FORCE}" != "true" ] && docker manifest inspect "${IMAGE}:${TAG}" >/dev/null 2>&1; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            echo "${IMAGE}:${TAG} already exists, nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the upstream release
        if: steps.existing.outputs.built != 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ steps.release.outputs.tag }}
          path: upstream

      # A release that already accepts QBT_SID_<port> needs no patched image: stop here so the
      # outdated patch is never applied silently and the official image can be used again.
      - name: Stop if upstream fixed the cookie itself
        if: steps.existing.outputs.built != 'true'
        id: upstream_fix
        run: |
          set -euo pipefail
          if grep -q 'QBT_SID' "upstream/${ADAPTER}"; then
            echo 'fixed=true' >> "$GITHUB_OUTPUT"
            {
              echo '## Upstream ships the fix'
              echo
              echo "${{ steps.release.outputs.tag }} accepts QBT_SID cookies on its own."
              echo 'Point the deployment back at ghcr.io/bookorbit/bookorbit and archive this repository.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'fixed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply the patch
        if: steps.existing.outputs.built != 'true' && steps.upstream_fix.outputs.fixed != 'true'
        run: |
          set -euo pipefail
          git -C upstream apply --verbose "${GITHUB_WORKSPACE}/patches/qbt-sid-cookie.patch"
          grep -q 'QBT_SID_' "upstream/${ADAPTER}"

      - name: Set up Buildx
        if: steps.existing.outputs.built != 'true' && steps.upstream_fix.outputs.fixed != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.existing.outputs.built != 'true' && steps.upstream_fix.outputs.fixed != 'true'
        uses: docker/build-push-action@v6
        with:
          context: upstream
          file: upstream/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: APP_VERSION=${{ steps.release.outputs.tag }}+qbt-cookie
          tags: |
            ${{ env.IMAGE }}:${{ steps.release.outputs.tag }}
            ${{ env.IMAGE }}:release
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Also keeps the scheduled trigger alive: GitHub disables cron in repositories
      # that see no activity for 60 days.
      - name: Record the built release
        if: steps.existing.outputs.built != 'true' && steps.upstream_fix.outputs.fixed != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          printf '%s built from %s at %s\n' "${IMAGE}:${TAG}" "${UPSTREAM}@${TAG}" "$(date -u +%FT%TZ)" > state/last-built.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/last-built.txt
          git commit -m "chore: record ${TAG} image build" || exit 0
          git push
          echo "Pushed ${IMAGE}:${TAG} and ${IMAGE}:release" >> "$GITHUB_STEP_SUMMARY"
